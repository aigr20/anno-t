<table>
  <thead>
    <tr>
      <th class="heading">Question</th>
      <th class="heading">Your answer</th>
      <th class="heading">Correct answer</th>
      <th class="heading">Score</th>
    </tr>
  </thead>
  <tbody>
    @for (answer of answers(); track answer.question) {
      <tr>
        <td class="data">{{ answer.question }}</td>
        <td class="data">{{ answer.userAnswer | bcAd }}</td>
        <td class="data">
          {{ answer.correctAnswer | bcAd }}
          @if (shouldPresentDifference(answer)) {
            ({{ presentDifference(answer) }})
          }
        </td>
        <td class="data">{{ answer.scoreReceived }}</td>
      </tr>
    }
  </tbody>
</table>

<button
  type="button"
  class="btn copy-btn"
  (click)="copyResults()">
  Copy results
</button>
