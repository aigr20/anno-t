<p class="guess">{{ currentGuess() | bcAd }}</p>

<div class="adjust-container">
  <button
    type="button"
    class="btn"
    (click)="adjustBy(-100)">
    -100
  </button>
  <button
    type="button"
    class="btn"
    (click)="adjustBy(-10)">
    -10
  </button>
  <button
    type="button"
    class="btn"
    (click)="adjustBy(-1)">
    -1
  </button>
  <button
    type="button"
    class="btn"
    (click)="adjustBy(1)">
    +1
  </button>
  <button
    type="button"
    class="btn"
    (click)="adjustBy(10)">
    +10
  </button>
  <button
    type="button"
    class="btn"
    (click)="adjustBy(100)">
    +100
  </button>
</div>

<button
  type="button"
  class="btn submit-guess"
  (click)="makeGuess()">
  Submit answer
</button>
