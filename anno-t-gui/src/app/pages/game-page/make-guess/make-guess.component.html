<form [formRoot]="guessFormModel">
  <div class="guess-container">
    <input
      class="guess"
      [class.invalid]="guessFormModel().invalid()"
      type="number"
      [formField]="guessFormModel" />
    <span class="guess-suffix">{{ suffix() }}</span>
  </div>

  <div class="adjust-container">
    <button
      type="button"
      class="btn"
      (click)="adjustBy(-100)">
      -100
    </button>
    <button
      type="button"
      class="btn"
      (click)="adjustBy(-10)">
      -10
    </button>
    <button
      type="button"
      class="btn"
      (click)="adjustBy(-1)">
      -1
    </button>
    <button
      type="button"
      class="btn"
      (click)="adjustBy(1)">
      +1
    </button>
    <button
      type="button"
      class="btn"
      (click)="adjustBy(10)">
      +10
    </button>
    <button
      type="button"
      class="btn"
      (click)="adjustBy(100)">
      +100
    </button>
  </div>

  <button
    type="submit"
    class="btn submit-guess">
    Submit answer
  </button>
</form>
