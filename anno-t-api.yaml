openapi: 3.1.0
info:
  title: Anno + Not
  version: 1.0.0

paths:
  /game/current:
    get:
      operationId: getCurrentGame
      summary: Get the currently active game
      tags:
        - Game
      responses:
        "200":
          description: "The game and its associated questions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /game/{gameId}/question/{index}:
    post:
      operationId: makeGuess
      summary: Guess the answer to the question at the given index
      tags:
        - Game
      parameters:
        - in: path
          name: gameId
          schema:
            type: string
            format: uuid
          required: true
          description: "The current game id"
        - in: path
          name: index
          schema:
            type: integer
          required: true
          description: "The index of the question to submit a guess for"
      requestBody:
        description: "The guess"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Guess"
      responses:
        "200":
          description: "The result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuessResult"
        "404":
          description: "That game, or that question does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedError"

components:
  schemas:
    Game:
      type: object
      required:
        - id
        - expires
        - questions
      properties:
        id:
          type: string
          format: uuid
        expires:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"

    Question:
      type: object
      description: "A question"
      required:
        - question
      properties:
        question:
          type: string
    Guess:
      type: object
      description: "A guess"
      required:
        - year
      properties:
        year:
          type: integer
    GuessResult:
      type: object
      description: "The result of a guess"
      required:
        - score
        - correctAnswer
        - distanceFromCorrect
      properties:
        score:
          type: integer
          min: 0
          max: 100
        correctAnswer:
          type: integer
        distanceFromCorrect:
          type: integer

    DetailedError:
      type: object
      required:
        - type
        - status
        - title
      properties:
        type:
          type: string
          enum:
            - MISSING_GAME
            - MISSING_QUESTION
            - UNKNOWN
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
