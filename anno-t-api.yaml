openapi: 3.1.0
info:
  title: Anno + Not
  version: 1.0.0

paths:
  /info:
    get:
      operationId: getInfo
      summary: Get information about the server
      tags:
        - Info
      responses:
        "200":
          description: "Information about the server hosting the game"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /game/current:
    get:
      operationId: getCurrentGame
      summary: Get the currently active game
      tags:
        - Game
      responses:
        "200":
          description: "The game and its associated questions"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /game/{gameId}/question/{index}:
    post:
      operationId: makeGuess
      summary: Guess the answer to the question at the given index
      tags:
        - Game
      parameters:
        - in: path
          name: gameId
          schema:
            type: string
            format: uuid
          required: true
          description: "The current game id"
        - in: path
          name: index
          schema:
            type: integer
          required: true
          description: "The index of the question to submit a guess for"
      requestBody:
        description: "The guess"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Guess"
      responses:
        "200":
          description: "The result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuessResult"
        "404":
          description: "That game, or that question does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedError"

  /leaderboard/{gameId}/entry:
    post:
      operationId: submitGameResult
      summary: Save the result of the game to the leaderboard
      tags:
        - Leaderboard
      parameters:
        - in: path
          name: gameId
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameResult"
      responses:
        "204":
          description: "The result has been saved"
  /leaderboard:
    get:
      operationId: getLeaderboard
      summary: Get the leaderboard on a date.
      tags:
        - Leaderboard
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
          required: false
      responses:
        "200":
          description: The leaderboard
        "404":
          description: "No game was played on that date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedError"

components:
  schemas:
    Game:
      type: object
      required:
        - id
        - begins
        - expires
        - questions
      properties:
        id:
          type: string
          format: uuid
        begins:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"

    Question:
      type: object
      description: "A question"
      required:
        - question
      properties:
        question:
          type: string
    Guess:
      type: object
      description: "A guess"
      required:
        - year
      properties:
        year:
          type: integer
    GuessResult:
      type: object
      description: "The result of a guess"
      required:
        - score
        - correctAnswer
        - distanceFromCorrect
      properties:
        score:
          type: integer
          min: 0
          max: 100
        correctAnswer:
          type: integer
        distanceFromCorrect:
          type: integer

    DetailedError:
      type: object
      required:
        - type
        - status
        - title
      properties:
        type:
          type: string
          enum:
            - MISSING_GAME
            - MISSING_QUESTION
            - UNKNOWN
        status:
          type: integer
        title:
          type: string
        detail:
          type: string

    ServerInfo:
      type: object
      required:
        - gameUrl
      properties:
        gameUrl:
          type: string

    GameResult:
      type: object
      required:
        - totalScore
        - playerAlias
        - scoreByQuestion
      properties:
        totalScore:
          type: integer
        playerAlias:
          type: string
        scoreByQuestion:
          type: array
          items:
            type: integer
          description: "Score received, in the same order as the questions"
          minItems: 5
          maxItems: 5

    Leaderboard:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRecord"

    LeaderboardRecord:
      type: object
      required:
        - player
        - score
        - scoreByQuestion
      properties:
        player:
          type: string
        score:
          type: integer
        scoreByQuestion:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardQuestion"

    LeaderboardQuestion:
      type: object
      required:
        - score
        - index
      properties:
        score:
          type: integer
        index:
          type: integer
